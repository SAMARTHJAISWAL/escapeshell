name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "20", "24"]
        include:
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - name: Run it the way players do, from a packed tarball
        shell: bash
        run: |
          npm pack --silent
          printf 'ls\nhint\nexit\n' | npx --yes --package=./$(ls escapeshell-*.tgz) escapeshell --seed 1
